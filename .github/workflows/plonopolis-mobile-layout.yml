name: Plonopolis mobile layout

on:
  pull_request:
    paths:
      - "artifacts/plonopolis/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/plonopolis-mobile-layout.yml"

permissions:
  contents: read

jobs:
  mobile-layout:
    name: Portrait and landscape mobile tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Plonopolis end-to-end tests
        run: pnpm test:e2e:plonopolis