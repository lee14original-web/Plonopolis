server {
    listen $PORT default_server;
    root /usr/share/nginx/html;
    index index.html;

    # ── Supabase reverse proxy ──────────────────────────────────────────────
    # resolver 8.8.8.8 + set $upstream = lazy DNS (nie blokuje startu nginx)
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /sb-proxy/ {
        set $upstream https://yfiatxngpdkjzzmddnqm.supabase.co;
        rewrite ^/sb-proxy/(.*) /$1 break;
        proxy_pass $upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host yfiatxngpdkjzzmddnqm.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── SPA routing ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
