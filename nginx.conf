server {
    listen $PORT default_server;
    root /usr/share/nginx/html;
    index index.html;

    # ── Supabase reverse proxy ──────────────────────────────────────────────
    # Przeglądarka widzi tylko naszą domenę → blokery trackerów nie blokują.
    location /sb-proxy/ {
        # Usuwamy prefiks /sb-proxy/ i przekazujemy resztę ścieżki do Supabase
        rewrite ^/sb-proxy/(.*) /$1 break;
        proxy_pass https://yfiatxngpdkjzzmddnqm.supabase.co;
        proxy_ssl_server_name on;
        proxy_set_header Host yfiatxngpdkjzzmddnqm.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket support (dla Supabase Realtime)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ── SPA routing ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}

# Potrzebne do WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
