server {
    listen $PORT default_server;
    root /usr/share/nginx/html;
    index index.html;

    # ── Supabase reverse proxy ──────────────────────────────────────────────
    # Regex capture ścieżki po /sb-proxy/, dynamiczny upstream (lazy DNS)
    location ~ ^/sb-proxy/(.*)$ {
        resolver 127.0.0.11 valid=30s ipv6=off;

        set $supabase_path  /$1;
        set $supabase_query $is_args$args;
        set $upstream       https://yfiatxngpdkjzzmddnqm.supabase.co;

        proxy_pass          $upstream$supabase_path$supabase_query;
        proxy_ssl_server_name on;
        proxy_set_header    Host            yfiatxngpdkjzzmddnqm.supabase.co;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── SPA routing ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
